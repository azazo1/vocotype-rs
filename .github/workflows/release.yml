name: Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有 tag, 留空时只构建并上传 artifact"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version context
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.release_context.outputs.is_release }}
      tag_name: ${{ steps.release_context.outputs.tag_name }}
      source_ref: ${{ steps.release_context.outputs.source_ref }}
      package_version: ${{ steps.package_version.outputs.package_version }}
      version: ${{ steps.release_version.outputs.version }}
      build_version: ${{ steps.build_version.outputs.build_version }}
    steps:
      - name: Parse release context
        id: release_context
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_REF: ${{ github.ref }}
          CURRENT_REF_NAME: ${{ github.ref_name }}
          CURRENT_SHA: ${{ github.sha }}
          DISPATCH_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          is_release=false
          tag_name=""
          source_ref="$CURRENT_SHA"

          if [[ "$EVENT_NAME" == "push" && "$CURRENT_REF" == refs/tags/* ]]; then
            is_release=true
            tag_name="$CURRENT_REF_NAME"
            source_ref="$CURRENT_REF"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$DISPATCH_TAG" ]]; then
            git check-ref-format "refs/tags/$DISPATCH_TAG"
            is_release=true
            tag_name="$DISPATCH_TAG"
            source_ref="refs/tags/$DISPATCH_TAG"
          fi

          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout target ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.release_context.outputs.source_ref }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Resolve package version
        id: package_version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -er '.packages[] | select(.name == "vocotype-rs") | .version'
          )"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Validate release version and notes
        id: release_version
        if: steps.release_context.outputs.is_release == 'true'
        env:
          TAG_NAME: ${{ steps.release_context.outputs.tag_name }}
          PACKAGE_VERSION: ${{ steps.package_version.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="v${PACKAGE_VERSION}"
          if [[ "$TAG_NAME" != "$expected_tag" ]]; then
            printf 'tag %s 与包版本 %s 不一致\n' "$TAG_NAME" "$expected_tag" >&2
            exit 1
          fi

          manual_notes="docs/changelog/${PACKAGE_VERSION}.md"
          if [[ ! -s "$manual_notes" ]]; then
            printf '缺少 release notes: %s\n' "$manual_notes" >&2
            exit 1
          fi

          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve build version
        id: build_version
        env:
          IS_RELEASE: ${{ steps.release_context.outputs.is_release }}
          PACKAGE_VERSION: ${{ steps.package_version.outputs.package_version }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IS_RELEASE" == "true" ]]; then
            build_version="$RELEASE_VERSION"
          else
            short_hash="$(git rev-parse HEAD | cut -c1-7)"
            build_version="${PACKAGE_VERSION}-${short_hash}"
          fi
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            arch: aarch64
            archive_extension: dmg
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
      BUILD_VERSION: ${{ needs.version.outputs.build_version }}
      IS_RELEASE: ${{ needs.version.outputs.is_release }}
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - name: Checkout target ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: vocotype-${{ matrix.platform }}-${{ matrix.arch }}

      - name: Verify native architecture
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "arm64" ]; then
            printf '预期 ARM64 runner, 实际架构为 %s\n' "$(uname -m)" >&2
            exit 1
          fi

      - name: Build macOS distribution
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.package_version }}
          BUILD_VERSION: ${{ needs.version.outputs.build_version }}
        run: |
          set -euo pipefail
          sh scripts/dist-macos.sh

      - name: Smoke test application binary
        shell: bash
        run: |
          set -euo pipefail
          binary="target/macos-app/VocoType.app/Contents/MacOS/vocotype"
          test -x "$binary"
          file "$binary" | grep -q 'Mach-O'
          version_output="$("$binary" --version)"
          if [[ "$IS_RELEASE" == "true" ]]; then
            expected="vocotype v${PACKAGE_VERSION}"
            if [[ "$version_output" != "$expected" ]]; then
              printf 'CLI 版本输出 %s, 预期 %s\n' "$version_output" "$expected" >&2
              exit 1
            fi
          else
            if [[ "$version_output" == *"^"* ]]; then
              printf 'CI 构建不应包含脏工作区标记: %s\n' "$version_output" >&2
              exit 1
            fi
            if [[ "$version_output" != "vocotype v${PACKAGE_VERSION}" &&
                  ! "$version_output" =~ ^vocotype\ v.+-[0-9a-f]{7,}$ ]]; then
              printf 'CLI 版本输出不符合约定: %s\n' "$version_output" >&2
              exit 1
            fi
          fi

      - name: Validate dmg contents
        shell: bash
        run: |
          set -euo pipefail
          dmg="dist/vocotype-${BUILD_VERSION}-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive_extension }}"
          test -s "$dmg"
          mount_point="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg"
          trap 'hdiutil detach "$mount_point" >/dev/null 2>&1 || true' EXIT

          test -L "$mount_point/Applications"
          test -d "$mount_point/VocoType.app"
          applications_target="$(readlink "$mount_point/Applications")"
          if [[ "$applications_target" != "/Applications" ]]; then
            printf 'Applications 链接目标应为 /Applications, 实际为 %s\n' "$applications_target" >&2
            exit 1
          fi
          test -x "$mount_point/VocoType.app/Contents/MacOS/vocotype"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vocotype-${{ needs.version.outputs.build_version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/vocotype-${{ needs.version.outputs.build_version }}-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive_extension }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create or update GitHub release
    if: needs.version.outputs.is_release == 'true'
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.version.outputs.tag_name }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0

      - name: Refetch annotated tag object
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$TAG_NAME"
          git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"

      - name: Validate tag annotation
        shell: bash
        run: |
          set -euo pipefail
          manual_notes="docs/changelog/$VERSION.md"
          if [[ ! -s "$manual_notes" ]]; then
            printf '缺少 release notes: %s\n' "$manual_notes" >&2
            exit 1
          fi

          tag_ref="refs/tags/$TAG_NAME"
          if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
            printf '发布 tag 必须是 annotated tag: %s\n' "$TAG_NAME" >&2
            exit 1
          fi

          git cat-file tag "$tag_ref" | sed '1,/^$/d' > tag-notes.md
          if ! grep -q '[^[:space:]]' tag-notes.md; then
            printf '发布 tag 的 annotation 不能为空: %s\n' "$TAG_NAME" >&2
            exit 1
          fi

          if ! cmp -s "$manual_notes" tag-notes.md; then
            printf '发布 tag 的 annotation 与 %s 不一致\n' "$manual_notes" >&2
            diff -u "$manual_notes" tag-notes.md || true
            exit 1
          fi

          cp "$manual_notes" release-notes.md

      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manual_notes="docs/changelog/$VERSION.md"
          base_tag_file="docs/changelog/$VERSION-base.txt"
          api_args=(
            --method POST
            "repos/$GITHUB_REPOSITORY/releases/generate-notes"
            -f "tag_name=$TAG_NAME"
          )

          target_sha="$(git rev-parse HEAD)"
          api_args+=(-f "target_commitish=$target_sha")

          if [[ -s "$base_tag_file" ]]; then
            base_tag="$(<"$base_tag_file")"
            git check-ref-format "refs/tags/$base_tag"
            api_args+=(-f "previous_tag_name=$base_tag")
          fi

          gh api "${api_args[@]}" --jq '.body' > generated-notes.md
          cp "$manual_notes" release-notes.md
          if [[ -s generated-notes.md ]]; then
            printf '\n---\n\n' >> release-notes.md
            cat generated-notes.md >> release-notes.md
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: vocotype-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate checksums and verify artifact count
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release-artifacts
          archives=(vocotype-*.dmg)
          if (( ${#archives[@]} != 1 )); then
            printf '预期 1 个归档, 实际找到 %s 个\n' "${#archives[@]}" >&2
            exit 1
          fi

          sha256sum "${archives[@]}" > SHA256SUMS
          test -s SHA256SUMS
          cd ..

          assets=(release-artifacts/vocotype-*.dmg release-artifacts/SHA256SUMS)
          if (( ${#assets[@]} != 2 )); then
            printf '预期 2 个发布文件, 实际找到 %s 个\n' "${#assets[@]}" >&2
            exit 1
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-artifacts/vocotype-*.dmg release-artifacts/SHA256SUMS)
          if (( ${#assets[@]} != 2 )); then
            printf '预期 2 个发布文件, 实际找到 %s 个\n' "${#assets[@]}" >&2
            exit 1
          fi

          prerelease_args=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          title="VocoType v${VERSION}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --verify-tag \
              --title "$title" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --verify-tag \
              --title "$title" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
          fi
